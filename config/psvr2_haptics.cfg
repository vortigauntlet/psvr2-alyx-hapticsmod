# PSVR2 Alyx Haptics configuration
#
# Every setting here is optional. With no config file at all the program
# auto-detects Steam, Half-Life: Alyx and the PSVR2Toolkit DLL and uses the
# defaults below. Edit only what you want to change.
#
# The file is read as UTF-8. A UTF-8 byte-order mark is tolerated, so it is
# safe to save from PowerShell, Notepad or anything else.

# ---------------------------------------------------------------------------
# Paths - leave blank to auto-detect
# ---------------------------------------------------------------------------
# hla_path=C:\Program Files (x86)\Steam\steamapps\common\Half-Life Alyx
# toolkit_dll=C:\Program Files (x86)\Steam\steamapps\common\PlayStation VR2 App\SteamVR_Plug-In\bin\win64\psvr2_toolkit_capi.dll

# ---------------------------------------------------------------------------
# Levels
# ---------------------------------------------------------------------------
# master        overall PCM strength      (0.0 - 2.5, default 1.0)
# trigger_master adaptive trigger strength (0.0 - 2.0, default 1.0)
#
# Note: raising master past about 1.4 mostly adds saturation rather than
# loudness, because the mixer soft-clips. If something feels weak, it is
# usually the wrong frequency rather than the wrong level.
master=1.2
trigger_master=1.0

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
handedness=right
adaptive_triggers=true
physics=true
debug=false
poll_ms=12

# Door interaction.
#
# Alyx raises no event for opening a door, so this is inferred by polling: the
# door must be turning, a hand must be close to it, and that hand must itself
# be moving. It is the most heuristic thing in the build - set this to false if
# you ever feel a door you are not touching.
doors=true

# ---------------------------------------------------------------------------
# Physics tuning
# ---------------------------------------------------------------------------
# Impacts are reported only for an object that is STILL IN YOUR HAND when it
# hits something. Once a prop leaves the hand nothing about its collision is
# felt, because your hand is no longer connected to it.
#
# The impulse is inferred from the speed the object lost that your hand did
# not, scaled by mass. Raise min_impact_impulse if light props register too
# eagerly; raise impact_cooldown_ms if dragging something along a surface
# reads as a buzz rather than as separate knocks.
min_impact_impulse=150
impact_cooldown_ms=80

# Damage feedback is sized by how hard you were HIT, not by how much health
# remains - identical hits should feel identical. Damage below min_damage is
# ignored entirely, so a graze does not interrupt what your hands are doing.
min_damage=4

# ---------------------------------------------------------------------------
# Per-event gain, applied on top of master. gain.<EVENT>=<multiplier>
# Event names are the ones printed with debug=true.
# ---------------------------------------------------------------------------
# The gravity glove used to be boosted here because its signature was too
# quiet. It is not any more - the catch and its mass layer are balanced at
# unity by design, and re-applying the old 1.15/1.10 boost on top drove a heavy
# catch into the limiter at 0.65, squashing the very contrast the mass layer
# exists to create. Verify with --analyze before raising either of these.
gain.GLOVE_CATCH=1.00
gain.GLOVE_CATCH_MASS=1.00
gain.GLOVE_PULL=1.00
gain.GLOVE_LOCK_START=1.00
gain.GLOVE_LOCK_STOP=0.70
gain.FIRE=1.00
gain.HURT=1.05
gain.RELOAD=0.95
gain.PHYS_IMPACT=1.10
gain.PHYS_PICKUP=0.90
gain.PHYS_THROW=0.95
gain.MANTLE=0.80
gain.LADDER=0.60
gain.DOOR_MOVE=1.00
gain.PHYS_HOLD=1.00

# JUMP, TELEPORT_START, TELEPORT_FINISH and KILL used to be listed here. None
# of them are emitted any more: no hand touches anything during a jump or a
# teleport, and a kill is a HUD cue rather than something a hand feels.

# ---------------------------------------------------------------------------
# Per-weapon gain, applied on top of the above. weapon.<NAME>=<multiplier>
# Names: PISTOL SHOTGUN SMG GRENADE TOOL HANDS
# ---------------------------------------------------------------------------
weapon.SHOTGUN=1.10
weapon.PISTOL=1.00
weapon.SMG=0.90
weapon.GRENADE=1.00
